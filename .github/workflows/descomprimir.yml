
name: Descomprimir zip inicial
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  descomprimir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir el zip mas reciente
        run: |
          ZIP=$(for f in Comedor-Ingenio*.zip; do n=$(echo "$f" | grep -o '([0-9]*)' | tr -d '()'); echo "${n:-0}|$f"; done | sort -t'|' -k1,1n | tail -n 1 | cut -d'|' -f2)
          echo "Usando: $ZIP"
          unzip -q "$ZIP" -d /tmp/ci
          cp -a /tmp/ci/Comedor-Ingenio/. .
          rm -f Comedor-Ingenio*.zip
      - name: Commit y push
        run: |
          git config user.name "Comedor Ingenio"
          git config user.email "dev@comedoringenio.local"
          git add -A
          git commit -m "feat: actualizacion desde zip" || echo "Sin cambios"
          git push origin HEAD:main
